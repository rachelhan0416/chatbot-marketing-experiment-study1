<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scenario Chatbot Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="layout">
      <aside class="panel controls">
        <h1>Scenario Chatbot Lab</h1>
        <p class="subhead">
          LLM-based sleep support chatbot with controlled experimental conditions.
        </p>

        <section class="editor-section">
          <h2>LLM Backend</h2>
          <p class="hint">
            Start the local proxy server and keep model settings constant for all
            conditions.
          </p>
          <label for="apiBaseUrl">Proxy URL</label>
          <input
            id="apiBaseUrl"
            type="text"
            value="http://127.0.0.1:8787"
            autocomplete="off"
          />
          <label for="modelInput">Model</label>
          <input
            id="modelInput"
            type="text"
            value="gpt-4.1-mini"
            autocomplete="off"
          />
          <div class="row">
            <button id="saveBackendBtn" class="ghost">Save Backend Settings</button>
          </div>
        </section>

        <label for="scenarioSelect">Scenario</label>
        <select id="scenarioSelect"></select>

        <div class="row">
          <button id="resetChatBtn" class="ghost">Reset Chat</button>
          <button id="exportBtn" class="ghost">Export Transcript</button>
        </div>

        <section class="editor-section">
          <h2>Scenario Editor (JSON)</h2>
          <p class="hint">
            Edit scenario labels/instructions if needed, then click Apply.
          </p>
          <textarea id="scenarioEditor" spellcheck="false"></textarea>
          <div class="row">
            <button id="applyScenariosBtn">Apply Scenarios</button>
            <button id="restoreDefaultsBtn" class="ghost">
              Restore Defaults
            </button>
          </div>
          <p id="status" role="status" aria-live="polite"></p>
        </section>
      </aside>

      <section class="panel chat">
        <header class="chat-header">
          <h2 id="activeScenarioTitle">Chat</h2>
          <p id="activeScenarioDescription"></p>
        </header>

        <div id="chatLog" class="chat-log" aria-live="polite"></div>

        <form id="chatForm" class="chat-form">
          <label class="sr-only" for="userInput">Message</label>
          <input
            id="userInput"
            type="text"
            placeholder="Type a message..."
            autocomplete="off"
            required
          />
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="app.js?v=20260219-2"></script>
  </body>
</html>
